[package]
name = "pradar-dsp"
version = "0.1.0"
edition = "2021"
description = "Real-time passive radar DSP worker (ECA + batched CAF + 2D CA-CFAR). Mirrors ../pradar (Python)."
publish = false

[dependencies]
rustfft = "6.2"
num-complex = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
